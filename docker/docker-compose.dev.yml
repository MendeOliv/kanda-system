version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kanda-postgres-dev
    environment:
      POSTGRES_USER: ${DB_USER:-kanda_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kanda_password}
      POSTGRES_DB: ${DB_NAME:-kanda_dev}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - kanda-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kanda_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    container_name: kanda-backend-dev
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${DB_USER:-kanda_user}:${DB_PASSWORD:-kanda_password}@postgres:5432/${DB_NAME:-kanda_dev}
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-key-change-in-production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      APPYPAY_API_KEY: ${APPYPAY_API_KEY:-sandbox-key}
      APPYPAY_SECRET_KEY: ${APPYPAY_SECRET_KEY:-sandbox-secret}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    ports:
      - "3002:3001"
    volumes:
      - ../backend/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kanda-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: kanda-frontend-dev
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    volumes:
      - ../frontend/src:/app/src
      - ../frontend/public:/app/public
    depends_on:
      - backend
    networks:
      - kanda-network

networks:
  kanda-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local