version: '3.9'

services:
  # PostgreSQL Database (Development)
  postgres:
    image: postgres:16-alpine
    container_name: kanda-postgres-dev
    environment:
      POSTGRES_USER: ${DB_USER:-kanda_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kanda_password}
      POSTGRES_DB: ${DB_NAME:-kanda_dev}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - kanda-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kanda_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache (Development)
  redis:
    image: redis:7-alpine
    container_name: kanda-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - kanda-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS Backend (Development)
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    container_name: kanda-backend-dev
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${DB_USER:-kanda_user}:${DB_PASSWORD:-kanda_password}@postgres:5432/${DB_NAME:-kanda_dev}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-key-change-in-production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY:-}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL:-}
      APPYPAY_API_KEY: ${APPYPAY_API_KEY:-sandbox-key}
      APPYPAY_SECRET_KEY: ${APPYPAY_SECRET_KEY:-sandbox-secret}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://n8n:5678}
      WAHA_API_URL: ${WAHA_API_URL:-http://waha:8000}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
    ports:
      - "3002:3001"
    volumes:
      - ../backend/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kanda-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # n8n Workflow Engine (Development)
  n8n:
    image: n8nio/n8n:latest
    container_name: kanda-n8n-dev
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n_dev
      DB_POSTGRESDB_USER: ${DB_USER:-kanda_user}
      DB_POSTGRESDB_PASSWORD: ${DB_PASSWORD:-kanda_password}
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:-password}
      N8N_INTERNAL_KEY: ${N8N_INTERNAL_KEY:-your-n8n-internal-key-generate-this}
      N8N_WEBHOOK_URL: http://localhost:5678/
      WEBHOOK_TUNNEL_URL: http://localhost:5678/
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
    ports:
      - "5679:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ../backend/n8n-workflows:/home/node/.n8n/workflows:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kanda-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # WAHA WhatsApp API (Development)
  waha:
    image: devlikeapro/waha:latest
    container_name: kanda-waha-dev
    environment:
      WHATSAPP_RESTART_ALL_FAILED_SESSION: "false"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8000:3000"
    volumes:
      - waha_sessions:/app/sessions
      - waha_files:/app/files
    networks:
      - kanda-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  kanda-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  n8n_data:
    driver: local
  waha_sessions:
    driver: local
  waha_files:
    driver: local
