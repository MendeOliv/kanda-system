<style>
        body {

<body class="flex items-center justify-center min-h-screen">
<!-- Decorative Elements -->
<div class="decoration-blob bg-primary-fixed w-[500px] h-[500px] -top-64 -left-32"></div>
<div class="decoration-blob bg-secondary-fixed w-[400px] h-[400px] -bottom-32 -right-32"></div>
<main class="w-full max-w-md px-6 py-lg">
<!-- Brand Identity Container -->
<div class="flex flex-col items-center mb-12">
<div class="w-24 h-24 mb-6 rounded-2xl overflow-hidden ambient-shadow bg-white p-2">
<img alt="Kanda Luanda Logo" class="w-full h-full object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDEMiO-tHVWuWTn0nKdCCH9Muc80ysPPVKaNb2V1fPgCHS4IobGxeN57qJq24tsnTSQxJlpA-7t8C-ugYrbQGf51i-3KzI2EWu4MHLqiqLycCnuTKBFCIISV_WJJOY5C8vWMSjoK0pDnd1NLt3RNXH0u30Rtf3ZBZDM31BnZ2uUwZhqxnMOoVY0rrzWr35OQRuGkjozze_rnk6MFTOOyJO3XWbZNAUvMic8p79hyCwrPGLuZ4vsTavqRHoLODB_Dmz19A"/>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">Bem-vindo à Kanda</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center">
                A sua mercearia de bairro, sempre fresca e próxima de si.
            </p>
</div>
<!-- Login Card -->
<div class="login-card p-xl rounded-xl ambient-shadow">
<form class="space-y-6" id="loginForm">
<div>
<label class="block font-label-md text-label-md text-on-surface-variant mb-base" for="phone">
                        Número de Telemóvel
                    </label>
<div class="relative flex items-center group input-focus-effect border-2 border-surface-container-highest rounded-lg transition-all duration-200 bg-white">
<div class="flex items-center px-4 py-3 border-r border-surface-container-highest text-on-surface font-semibold bg-surface-container-low rounded-l-lg">
<span class="mr-2">🇦🇴</span>
<span>+244</span>
</div>
<input class="w-full px-4 py-3 bg-transparent border-none focus:ring-0 font-body-md text-on-surface placeholder-outline-variant" id="phone" maxlength="9" name="phone" placeholder="9XX XXX XXX" required="" type="tel"/>
</div>
</div>
<button class="w-full bg-primary text-on-primary py-4 rounded-lg font-label-md text-label-md btn-hover-effect flex items-center justify-center gap-2" type="submit">
                    Pedir Código
                    <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Secondary Actions -->
<div class="mt-8 pt-8 border-t border-surface-container-highest">
<p class="text-center font-label-sm text-label-sm text-on-surface-variant">
                    Ao continuar, concorda com os nossos 
                    <a class="text-primary hover:underline font-semibold" href="#">Termos de Serviço</a> e 
                    <a class="text-primary hover:underline font-semibold" href="#">Privacidade</a>.
                </p>
</div>
</div>
<!-- Footer Help -->
<div class="mt-lg text-center">
<button class="font-label-md text-label-md text-secondary flex items-center justify-center mx-auto gap-2 hover:text-primary transition-colors">
<span class="material-symbols-outlined">help_outline</span>
                Precisa de ajuda com o acesso?
            </button>
</div>
</main>
<script>
        // Simple input formatting for Angolan phone numbers
        const phoneInput = document.getElementById('phone');
        
        phoneInput.addEventListener('input', (e) => {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 9) value = value.slice(0, 9);
            e.target.value = value;
        });

        // Feedback simulation
        const loginForm = document.getElementById('loginForm');
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalContent = btn.innerHTML;
            
            // Visual feedback
            btn.disabled = true;
            btn.innerHTML = `
                <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>A enviar...</span>
            `;

            setTimeout(() => {
                alert('Código enviado com sucesso para +244 ' + phoneInput.value);
                btn.disabled = false;
                btn.innerHTML = originalContent;
            }, 1500);
        });
    </script>
